<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Listener</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .container {
            width: 100%;
        }
        .info {
            text-align: center;
            font-weight: 700;
            font-size: 30px;
        }
        .flex {
            margin: 0 auto;
            display: flex;
            width: 750px;
            flex-wrap: wrap;
        }
        .flex > div {
            font-size: 20px;
            font-weight: 700;
            padding: 60px;
            border: black solid 5px;
            color: #fff;
            width: 150px;
            height: 150px;
            margin: 5px;
            background: #6521e2;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .flex > div.selected {
            background: #e22121;
            border-color: #111;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">
            <p>Сумма значений выделенных ячеек: <span id="sum">0</span></p>
            <p>Количество выделенных ячеек: <span id="count">0</span></p>
        </div>
        <div class="flex">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
